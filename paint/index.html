<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Paint Physics</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
</head>
<body>
<canvas id="stage"></canvas>
<script src="../shared/kit.js?v=3"></script>
<script>
'use strict';
/* Flick paint at the canvas. It splats, then drips down while it's wet.
   Colors really mix: blue + yellow makes green. Hit spin to fling
   everything outward like a salad spinner. */
Kit.init('🎨', 'Paint Physics');
    Kit.guide([{type:'drag',from:[.25,.62],to:[.75,.34]}]);
const ctx = Kit.ctx;

/* persistent painting lives on an offscreen canvas */
const art = document.createElement('canvas');
const actx = art.getContext('2d');
function sizeArt(){
  const old = document.createElement('canvas');
  old.width = art.width; old.height = art.height;
  old.getContext('2d').drawImage(art, 0, 0);
  art.width = Kit.W; art.height = Kit.H;
  actx.fillStyle = '#FBF6EC'; actx.fillRect(0, 0, art.width, art.height);
  if (old.width) actx.drawImage(old, 0, 0);
}
Kit.onResize = sizeArt; sizeArt();

const PALETTE = [
  { icon: '🔴', c: [230, 60, 70] }, { icon: '🟡', c: [250, 205, 50] },
  { icon: '🔵', c: [50, 110, 230] }, { icon: '⚪', c: [250, 250, 250] },
  { icon: '⚫', c: [40, 40, 45] }
];
let color = PALETTE[0].c;
const blobs = []; // wet paint in flight / dripping: {x,y,vx,vy,r,c,wet}
let spin = 0;

Kit.tray([...PALETTE.map((p, i) => ({ icon: p.icon, id: 'c' + i })),
  { icon: '🌀', id: 'spin' }, { icon: '🧻', id: 'clear' }],
  id => {
    if (id === 'spin'){ spin = 1.6; Sound.whoosh(); return; }
    if (id === 'clear'){ actx.fillStyle = '#FBF6EC'; actx.fillRect(0, 0, art.width, art.height); blobs.length = 0; Sound.ding(); return; }
    color = PALETTE[Number(id.slice(1))].c;
  }, 'c0');

/* flick = fast drag; slow drag = brush */
Kit.canvas.addEventListener('pointermove', e => {
  const p = Kit.pointers.get(e.pointerId);
  if (!p || e.clientY > Kit.H - 100) return;
  const vx = (p.x - p.px) * 20, vy = (p.y - p.py) * 20;
  const speed = Math.hypot(vx, vy);
  if (speed > 900){
    // flick: launch blobs from finger along the motion
    for (let k = 0; k < 3; k++)
      blobs.push({ x: p.x, y: p.y, vx: vx * rand(0.5, 1) + rand(-80, 80), vy: vy * rand(0.5, 1) + rand(-80, 80),
        r: rand(6, 16), c: color, wet: rand(1.5, 3) });
    if (Math.random() < 0.3) Sound.splash();
  } else {
    stamp(p.x, p.y, 14, color, 0.9);
    if (Math.random() < 0.06) Sound.click();
  }
});

function stamp(x, y, r, c, alpha){
  actx.globalAlpha = alpha;
  actx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  actx.beginPath(); actx.arc(x, y, r, 0, 6.28); actx.fill();
  // rough splat edges
  for (let k = 0; k < 3; k++){
    const a = rand(0, 6.28), d = r * rand(0.9, 1.5);
    actx.beginPath(); actx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * rand(0.2, 0.45), 0, 6.28); actx.fill();
  }
  actx.globalAlpha = 1;
}

Kit.loop((dt, t) => {
  spin = Math.max(0, spin - dt * 0.7);
  const cx = Kit.W / 2, cy = Kit.H / 2;

  for (let i = blobs.length - 1; i >= 0; i--){
    const b = blobs[i];
    b.wet -= dt;
    if (spin > 0){
      // centrifugal: push away from center, plus a swirl
      const dx = b.x - cx, dy = b.y - cy, d = Math.max(40, Math.hypot(dx, dy));
      b.vx += (dx / d) * spin * 900 * dt - (dy / d) * spin * 500 * dt;
      b.vy += (dy / d) * spin * 900 * dt + (dx / d) * spin * 500 * dt;
    } else {
      b.vy += 500 * dt;          // gravity: wet paint drips
      b.vx *= (1 - dt * 2);
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    // paint a trail while moving fast, a splat when slow
    const sp = Math.hypot(b.vx, b.vy);
    stamp(b.x, b.y, b.r * (sp > 400 ? 0.5 : 1), b.c, 0.85);
    if (b.wet <= 0 || b.y > Kit.H + 40 || b.x < -40 || b.x > Kit.W + 40 || sp < 30){
      if (sp >= 30 && b.y <= Kit.H) stamp(b.x, b.y, b.r * 1.4, b.c, 0.9);
      blobs.splice(i, 1);
    }
  }

  ctx.drawImage(art, 0, 0, Kit.W, Kit.H);
  // wet blobs shine on top
  for (const b of blobs){
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, 6.28); ctx.fill();
  }
  if (spin > 0){
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 10 * spin);
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 8; ctx.setLineDash([30, 50]);
    ctx.beginPath(); ctx.arc(0, 0, Math.min(Kit.W, Kit.H) * 0.4, 0, 6.28); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
});
</script>
</body>
</html>
