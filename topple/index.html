<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower Topple</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
</head>
<body>
<canvas id="stage"></canvas>
<script src="../shared/kit.js?v=6"></script>
<script>
'use strict';
/* Stack blocks and animals, then knock them down with the wrecking ball
   or a good hard flick. Building and destroying are both the game. */
Kit.init('🧱', 'Tower Topple');
    Kit.guide([{type:'tap',x:.5,y:.38},{type:'tap',x:.5,y:.38}]);

Kit.loadMatter().then(Matter => {
  const { Engine, Bodies, Body, Composite, Constraint } = Matter;
  const engine = Engine.create();
  engine.gravity.y = 1;
  const world = engine.world;

  const SHAPES = [
    { icon: '🟧', make: (x, y) => Bodies.rectangle(x, y, 64, 64, { restitution: 0.1 }), draw: b => box(b, 64, 64, '#FF9330') },
    { icon: '🟦', make: (x, y) => Bodies.rectangle(x, y, 130, 34, { restitution: 0.1 }), draw: b => box(b, 130, 34, '#38BDF8') },
    { icon: '🟢', make: (x, y) => Bodies.circle(x, y, 30, { restitution: 0.5 }), draw: b => ball(b, 30, '#4ADE80') },
    { icon: '🐮', make: (x, y) => Bodies.rectangle(x, y, 58, 58, { restitution: 0.1 }), draw: b => glyph(b, '🐮', 62) },
    { icon: '🐸', make: (x, y) => Bodies.circle(x, y, 28, { restitution: 0.7 }), draw: b => glyph(b, '🐸', 60) },
    { icon: '🦆', make: (x, y) => Bodies.rectangle(x, y, 52, 52, { restitution: 0.3 }), draw: b => glyph(b, '🦆', 58) }
  ];
  let tool = SHAPES[0], wreck = null, wreckRope = null;

  /* Dynamite. Three at most, a five second fuse each, and one going off will
     set off any of the others close enough - which is the best thing about
     having three. The blast pushes bodies away from it, mass-scaled, because
     gravity here is a mass-scaled force and an unscaled push would fling the
     light pieces into orbit and barely nudge the heavy ones. */
  const FUSE = 5, MAX_STICKS = 3;
  let sticks = [], booms = [], placing = 'shape';
  const items = []; // {body, draw}

  function floorY(){ return Kit.H - 30; }
  let ground = null, walls = [];
  function buildBounds(){
    if (ground) Composite.remove(world, [ground, ...walls]);
    ground = Bodies.rectangle(Kit.W / 2, floorY() + 40, Kit.W * 2, 80, { isStatic: true });
    walls = [
      Bodies.rectangle(-30, Kit.H / 2, 60, Kit.H * 2, { isStatic: true }),
      Bodies.rectangle(Kit.W + 30, Kit.H / 2, 60, Kit.H * 2, { isStatic: true })
    ];
    Composite.add(world, [ground, ...walls]);
  }
  Kit.onResize = buildBounds;
  buildBounds();

  function spawn(x, y){
    const body = tool.make(x, y);
    Composite.add(world, body);
    items.push({ body, draw: tool.draw });
    Sound.click();
    if (items.length > 60){ const old = items.shift(); Composite.remove(world, old.body); }
  }

  function blastRadius(){ return Math.min(Kit.W, Kit.H) * 0.42; }
  function placeStick(x, y){
    if (sticks.length >= MAX_STICKS){          // already three: say no, gently
      for (const s of sticks) s.nudge = .5;
      Sound.click();
      return;
    }
    const body = Bodies.rectangle(x, y, 22, 54, { restitution: 0.08, friction: .6 });
    Composite.add(world, body);
    sticks.push({ body, t: 0, nudge: 0 });
    Sound.squeak();
  }
  function boom(s){
    const p = { x: s.body.position.x, y: s.body.position.y };
    Composite.remove(world, s.body);
    const R = blastRadius();
    const targets = items.map(i => i.body).concat(wreck ? [wreck] : []);
    for (const b of targets){
      const dx = b.position.x - p.x, dy = b.position.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d > R) continue;
      const k = (1 - d / R) * 0.055;
      const ux = d < 1 ? 0 : dx / d, uy = d < 1 ? -1 : dy / d;
      Body.applyForce(b, b.position, {
        x: ux * k * b.mass,
        y: (uy - 0.55) * k * b.mass          // a lift, so things go up not just out
      });
    }
    for (const o of sticks){                  // set off its neighbours
      if (o === s) continue;
      const d = Math.hypot(o.body.position.x - p.x, o.body.position.y - p.y);
      if (d < R * 0.8) o.t = Math.max(o.t, FUSE - 0.35);
    }
    booms.push({ x: p.x, y: p.y, age: 0, r: R });
    for (let i = 0; i < 22; i++){
      const a = rand(0, 6.28), sp = rand(90, 420);
      booms.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        age: 0, bit: true, col: pick(['#FF9330', '#FFD24A', '#E8552A']) });
    }
    Sound.tone(70, .45, 'sawtooth', .09, -30);
    Sound.thud();
  }

  function swingWreck(){
    if (wreck){ Composite.remove(world, [wreck, wreckRope]); wreck = null; Sound.click(); return; }
    const ax = Kit.W * 0.5, ay = -10;
    wreck = Bodies.circle(Kit.W * 0.06, Kit.H * 0.25, 42, { density: 0.02, restitution: 0.2 });
    wreckRope = Constraint.create({ pointA: { x: ax, y: ay }, bodyB: wreck, stiffness: 1,
      length: Math.hypot(ax - wreck.position.x, ay - wreck.position.y) });
    Composite.add(world, [wreck, wreckRope]);
    Sound.whoosh();
  }

  function reset(){
    for (const it of items) Composite.remove(world, it.body);
    items.length = 0;
    if (wreck){ Composite.remove(world, [wreck, wreckRope]); wreck = null; }
    for (const s of sticks) Composite.remove(world, s.body);
    sticks = []; booms = [];
    Sound.ding();
  }

  Kit.tray(
    [...SHAPES.map((s, i) => ({ icon: s.icon, id: 'shape' + i })),
     { icon: '🧨', id: 'dyn' }, { icon: '🪨', id: 'wreck' }, { icon: '🧹', id: 'reset' }],
    id => {
      if (id === 'wreck') swingWreck();
      else if (id === 'reset') reset();
      else if (id === 'dyn') placing = 'dynamite';
      else { placing = 'shape'; tool = SHAPES[Number(id.slice(5))]; }
    }, 'shape0');

  /* drag: grab nearest body and fling it; tap empty space: place a shape */
  let grab = null, grabPid = null;
  Kit.canvas.addEventListener('pointerdown', e => {
    const found = Matter.Query.point(items.map(i => i.body).concat(wreck ? [wreck] : []), { x: e.clientX, y: e.clientY });
    if (found.length){ grab = found[0]; grabPid = e.pointerId; }
    else if (e.clientY < Kit.H - 100){
      if (placing === 'dynamite') placeStick(e.clientX, e.clientY);
      else spawn(e.clientX, e.clientY);
    }
  });
  Kit.canvas.addEventListener('pointerup', e => { if (e.pointerId === grabPid){ grab = null; grabPid = null; } });

  /* collision thumps */
  Matter.Events.on(engine, 'collisionStart', ev => {
    for (const pair of ev.pairs){
      const speed = Math.hypot(pair.bodyA.velocity.x - pair.bodyB.velocity.x, pair.bodyA.velocity.y - pair.bodyB.velocity.y);
      if (speed > 6) Sound.thud();
    }
  });

  /* ---------- drawing ---------- */
  const ctx = Kit.ctx;
  function box(b, w, h, color){
    ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
    ctx.fillStyle = color; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 10); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function ball(b, r, color){
    ctx.fillStyle = color; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 6.28); ctx.fill(); ctx.stroke();
  }
  function glyph(b, e, size){ drawEmoji(ctx, e, b.position.x, b.position.y, size, b.angle); }

  Kit.loop((dt) => {
    // move grabbed body toward finger, giving it real velocity for flicks
    if (grab){
      const p = Kit.pointers.get(grabPid);
      if (p){
        Body.setVelocity(grab, { x: (p.x - grab.position.x) * 0.35, y: (p.y - grab.position.y) * 0.35 });
      }
    }
    /* fuses */
    for (let i = sticks.length - 1; i >= 0; i--){
      const st = sticks[i];
      st.t += dt;
      st.nudge = Math.max(0, st.nudge - dt * 2);
      const left = FUSE - st.t;
      if (left <= 0){ sticks.splice(i, 1); boom(st); continue; }
      // a hiss that gets busier as it burns down
      if (Math.random() < dt * (2 + (1 - left / FUSE) * 9)) Sound.crumble();
    }
    for (let i = booms.length - 1; i >= 0; i--){
      const b = booms[i];
      b.age += dt;
      if (b.bit){ b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; }
      if (b.age > (b.bit ? 0.75 : 0.4)) booms.splice(i, 1);
    }

    Engine.update(engine, Math.min(dt, 0.033) * 1000);

    const g = ctx.createLinearGradient(0, 0, 0, Kit.H);
    g.addColorStop(0, '#1a2a52'); g.addColorStop(1, '#0e1530');
    ctx.fillStyle = g; ctx.fillRect(0, 0, Kit.W, Kit.H);
    // grass floor
    ctx.fillStyle = '#2f7a45'; ctx.fillRect(0, floorY(), Kit.W, Kit.H - floorY());
    ctx.fillStyle = '#3f9e57';
    for (let x = 0; x < Kit.W; x += 26){
      ctx.beginPath(); ctx.arc(x, floorY(), 8, Math.PI, 0); ctx.fill();
    }
    for (const it of items) it.draw(it.body);

    /* dynamite: the stick, a fuse that visibly burns down, and a flash near
       the end. The shrinking fuse is the only countdown a child who cannot
       read is going to follow. */
    for (const st of sticks){
      const b = st.body, left = Math.max(0, FUSE - st.t), k = left / FUSE;
      const soon = left < 1.6;
      const pulse = soon ? (0.5 + Math.sin(st.t * 26) * 0.5) : 0;
      ctx.save();
      ctx.translate(b.position.x, b.position.y);
      ctx.rotate(b.angle + st.nudge * Math.sin(st.t * 40) * 0.12);
      if (pulse > 0.5){
        ctx.fillStyle = 'rgba(255,120,60,.35)';
        ctx.beginPath(); ctx.arc(0, 0, 44, 0, 6.28); ctx.fill();
      }
      drawEmoji(ctx, '🧨', 0, 4, 56);
      // the fuse, burning from the top down
      ctx.strokeStyle = '#E8DFC8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.lineTo(0, -26 - 20 * k);
      ctx.stroke();
      const sx = 0, sy = -26 - 20 * k;
      ctx.fillStyle = pulse > 0.5 ? '#FFF3B0' : '#FFB020';
      ctx.beginPath(); ctx.arc(sx, sy, 4 + Math.random() * 2.5, 0, 6.28); ctx.fill();
      ctx.restore();
    }
    for (const b of booms){
      if (b.bit){
        const kk = 1 - b.age / 0.75;
        ctx.globalAlpha = Math.max(0, kk);
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.arc(b.x, b.y, 5 * kk + 1, 0, 6.28); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        const kk = b.age / 0.4;
        ctx.strokeStyle = 'rgba(255,180,90,' + Math.max(0, 1 - kk).toFixed(2) + ')';
        ctx.lineWidth = 10 * (1 - kk) + 2;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * kk, 0, 6.28); ctx.stroke();
      }
    }
    // how many sticks you have left, as sticks
    for (let i = 0; i < MAX_STICKS; i++){
      const on = i < MAX_STICKS - sticks.length;
      drawEmoji(ctx, '🧨', Kit.W - 26 - i * 30, 30, 24, 0, on ? 1 : 0.22);
    }
    if (wreck){
      ctx.strokeStyle = '#9AA3C7'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(wreckRope.pointA.x, wreckRope.pointA.y);
      ctx.lineTo(wreck.position.x, wreck.position.y); ctx.stroke();
      ball(wreck, 42, '#6B7280');
      drawEmoji(ctx, '😜', wreck.position.x, wreck.position.y, 34, wreck.angle);
    }
  });
});
</script>
</body>
</html>
