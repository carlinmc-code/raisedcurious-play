<style>
:root{--cream:#FAF7F0;--ink:#1C1A16;--muted:#8C8278;--rule:#DDD5C8;--forest:#2D5A3D;--rust:#C4522A;--gold:#C9922A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'Lato',system-ui,-apple-system,sans-serif;

.good{color:var(--forest)} .bad{color:var(--rust)}
#verdict{margin-top:24px;padding:16px;border-radius:16px;border:2px solid var(--rule);background:#fff;
  font-size:16px;line-height:1.5}
#verdict b{display:block;font-family:Georgia,serif;font-size:18px;margin-bottom:6px}
a{color:var(--forest)}

<h2>What the browser reports</h2>
<table id="out"></table>
<div id="verdict"><b>Tap button 1 to begin.</b>The two buttons use different audio paths. Which one you hear tells us where the problem is.</div>
</div>
<script>
var rows = {}, ac = null, ticks = 0, t0 = 0, webTried = false, htmlTried = false;
function set(k, v, cls){ rows[k] = { v: v, cls: cls || '' }; draw(); }
function draw(){
  var t = document.getElementById('out'), h = '';
  for (var k in rows) h += '<tr><td>' + k + '</td><td class="' + rows[k].cls + '">' + rows[k].v + '</td></tr>';
  t.innerHTML = h;
}
set('Browser', /CriOS/.test(navigator.userAgent) ? 'Chrome on iOS' :
               /FxiOS/.test(navigator.userAgent) ? 'Firefox on iOS' :
               /iPad|iPhone|iPod/.test(navigator.userAgent) ? 'Safari on iOS' : 'not iOS');
set('Web Audio available', (window.AudioContext || window.webkitAudioContext) ? 'yes' : 'no',
    (window.AudioContext || window.webkitAudioContext) ? 'good' : 'bad');
try { var s = JSON.parse(localStorage.getItem('rc.toy.settings') || '{}');
      set('Sound setting in the toys', s.sound === false ? 'OFF' : 'on', s.sound === false ? 'bad' : 'good'); }
catch (e) { set('Sound setting in the toys', 'unreadable'); }

document.getElementById('web').addEventListener('click', function(){
  webTried = true;
  var C = window.AudioContext || window.webkitAudioContext;
  if (!C){ set('Result', 'no Web Audio at all', 'bad'); return verdict(); }
  if (!ac) ac = new C();
  set('Context state (before)', ac.state, ac.state === 'running' ? 'good' : 'bad');
  if (ac.state !== 'running'){ var p = ac.resume(); if (p && p.catch) p.catch(function(){}); }
  try { var b = ac.createBuffer(1, 1, ac.sampleRate), sn = ac.createBufferSource();
        sn.buffer = b; sn.connect(ac.destination); sn.start(0); set('Silent unlock frame', 'played', 'good'); }
  catch (e){ set('Silent unlock frame', 'failed: ' + e.message, 'bad'); }
  var o = ac.createOscillator(), g = ac.createGain(), now = ac.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(660, now);
  g.gain.setValueAtTime(0.14, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
  o.connect(g); g.connect(ac.destination); o.start(now); o.stop(now + 0.4);
  set('Sample rate', ac.sampleRate + ' Hz');
  t0 = ac.currentTime; ticks = 0;
  setTimeout(function(){
    set('Context state (after)', ac.state, ac.state === 'running' ? 'good' : 'bad');
    var moved = ac.currentTime - t0;
    set('Clock advanced', moved.toFixed(3) + ' s', moved > 0.2 ? 'good' : 'bad');
    set('Audio engine is rendering', moved > 0.2 ? 'YES' : 'NO', moved > 0.2 ? 'good' : 'bad');
    verdict();
  }, 700);
});

document.getElementById('html').addEventListener('click', function(){
  htmlTried = true;
  var c = document.getElementById('clip');
  c.currentTime = 0;
  var p = c.play();
  if (p && p.then) p.then(function(){ set('Normal audio playback', 'started', 'good'); verdict(); })
                    .catch(function(e){ set('Normal audio playback', 'blocked: ' + e.name, 'bad'); verdict(); });
  else { set('Normal audio playback', 'started', 'good'); verdict(); }
});

function verdict(){
  var v = document.getElementById('verdict');
  var rendering = rows['Audio engine is rendering'] && rows['Audio engine is rendering'].v === 'YES';
  var soundOff = rows['Sound setting in the toys'] && rows['Sound setting in the toys'].v === 'OFF';
  if (soundOff){
    v.innerHTML = '<b>Sound is switched off in the toys.</b>Open any game, hold the gear button for a second, and turn Sound back on.';
    return;
  }
  if (!webTried){ return; }
  if (!rendering){
    v.innerHTML = '<b>The browser is refusing to start Web Audio.</b>The clock is not advancing, so nothing can be heard. Reload this page and tap button 1 first, before anything else. If it still says NO, that is a browser-side block and worth telling me about.';
    return;
  }
  v.innerHTML = '<b>Web Audio is running correctly.</b>' +
    'The engine is rendering, so the browser believes it is making sound. ' +
    'If you did not hear button 1 but you DID hear button 2, iOS is silencing Web Audio ' +
    'specifically \u2014 check the side switch and Control Centre for Silent Mode, and the ringer ' +
    'volume, not just the media volume. If you heard neither, it is the iPad volume or output ' +
    'device (AirPlay, a paired speaker).';
}
draw();
</script></body></html>
