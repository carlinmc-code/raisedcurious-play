<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bug Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
</head>
<body>
<canvas id="stage"></canvas>
<script src="../shared/kit.js?v=5"></script>
<script>
'use strict';
/* Drop crumbs and watch the ants carry them home. Dig tunnels with a finger.
   The nest is a cutaway, so you can watch what happens after an ant goes in:
   crumbs get stacked in the pantry, eggs wobble in the nursery, tired ants
   nap, and there is a potty. That last one is not a joke - ants really do
   keep a dedicated waste chamber inside the nest and go back to the same
   corner of it, which is one of the more surprising true things about them. */
Kit.init('🐜', 'Bug Garden');
Kit.guide([{type:'tap',x:.34,y:.28},{type:'tap',x:.64,y:.40}]);
const ctx = Kit.ctx;

let ants = [], crumbs = [], flowers = [], puffs = [], eggs = [];
const EGG_TIME = 7;      // seconds from laid to hatched
const PER_EGG = 2;       // ants out of each one
const MAX_ANTS = 80;     // the nursery pauses here; past this it is a smear, not a colony
const LIFE = [80, 170];  // how long an ant stays before it wanders off
const GOODBYE = 14;      // it starts heading for the edge this long before the end
const LAY_GAP = 2.5;     // a new egg this often, while there is room for one
let layIn = 0;
let dirtCell = 10, DG = null, DW = 0, DH = 0, dirtTop = 0;
let rooms = {}, entrance = { x: 0, y: 0 }, j1 = { x: 0, y: 0 }, j2 = { x: 0, y: 0 };
let stored = 0, eggWob = 0;
let tool = 'crumb';

const ROOMS = [
  { id: 'pantry',  emoji: '🍪', at: [-1, 1] },
  { id: 'nursery', emoji: '🥚', at: [ 1, 1] },
  { id: 'potty',   emoji: '🚽', at: [-1, 2] },
  { id: 'bed',     emoji: '😴', at: [ 1, 2] }
];

function build(){
  dirtTop = Math.floor(Kit.H * 0.55);
  DW = Math.ceil(Kit.W / dirtCell); DH = Math.ceil((Kit.H - dirtTop) / dirtCell);
  DG = new Uint8Array(DW * DH).fill(1);   // 1 = dirt, 0 = tunnel

  const UH = Kit.H - dirtTop;                     // how much underground we have
  const cx = Kit.W * 0.5;
  const off = clamp(Kit.W * 0.24, 74, 168);
  const rr  = clamp(UH * 0.13, 24, 46);

  entrance = { x: cx, y: dirtTop + 10 };
  j1 = { x: cx, y: dirtTop + UH * 0.24 };
  j2 = { x: cx, y: dirtTop + UH * 0.58 };

  rooms = {};
  for (const R of ROOMS){
    const j = R.at[1] === 1 ? j1 : j2;
    rooms[R.id] = {
      id: R.id, emoji: R.emoji, r: rr,
      x: cx + R.at[0] * off, y: j.y,
      path: [entrance, { x: cx, y: j.y }, { x: cx + R.at[0] * off, y: j.y }]
    };
  }
  // carve the shaft, the corridors and the chambers
  const shaftR = Math.max(9, rr * 0.34);
  for (let y = entrance.y; y <= j2.y; y += 4) digAt(cx, y, shaftR);
  for (const R of ROOMS){
    const room = rooms[R.id];
    for (let k = 0; k <= 1; k += .04)
      digAt(cx + (room.x - cx) * k, room.y, shaftR * 0.9);
    digAt(room.x, room.y, rr);
  }
  ants = Array.from({ length: 14 }, () => newAnt(cx + rand(-30, 30), dirtTop - rand(20, 90)));
  crumbs = []; flowers = []; puffs = []; stored = 0;
  eggs = []; layIn = 0;
  for (let i = 0; i < 3; i++) layEgg();
}
function layEgg(){
  const r = rooms.nursery;
  if (!r || eggs.length >= 4) return;
  eggs.push({
    x: r.x + rand(-r.r * .48, r.r * .48),
    y: r.y + rand(-r.r * .18, r.r * .40),
    t: 0, wob: rand(0, 6.28)
  });
}
function newAnt(x, y){
  return { x, y, a: rand(0, 6.28), carrying: false, speed: rand(26, 44), wob: rand(0, 6),
           job: 'forage', route: null, sit: 0, sitAt: null,
           age: 0, life: rand(LIFE[0], LIFE[1]), goodbye: false, exit: null };
}
/* Nothing dies in Bug Garden. When an ant's time is nearly up it finishes what
   it is doing, comes up out of the nest and walks off the side of the screen,
   which leaves room for the next one to hatch. That is what keeps the colony
   at the cap rather than frozen at it. */
function sayGoodbye(ant){
  ant.goodbye = true;
  ant.sit = 0;
  ant.carrying = false;
  ant.exit = { x: ant.x < Kit.W / 2 ? -34 : Kit.W + 34, y: dirtTop - rand(26, 96) };
  if (ant.y > dirtTop) leaveNest(ant);
  else ant.route = null;
}
function hatch(e){
  for (let i = 0; i < PER_EGG; i++){
    const ant = newAnt(e.x + rand(-6, 6), e.y + rand(-4, 4));
    leaveNest(ant);                       // a new ant walks out of the nest itself
    ants.push(ant);
  }
  puffs.push({ x: e.x, y: e.y - 6, e: '✨', age: 0 });
  Sound.squeak();
}
function digAt(px, py, r){
  const cx = Math.floor(px / dirtCell), cy = Math.floor((py - dirtTop) / dirtCell), cr = Math.ceil(r / dirtCell);
  for (let dy = -cr; dy <= cr; dy++)
    for (let dx = -cr; dx <= cr; dx++){
      if (dx * dx + dy * dy > cr * cr) continue;
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && x < DW && y >= 0 && y < DH) DG[y * DW + x] = 0;
    }
}
const isDug = (px, py) => {
  if (py < dirtTop) return true;
  const x = Math.floor(px / dirtCell), y = Math.floor((py - dirtTop) / dirtCell);
  if (x < 0 || x >= DW || y < 0 || y >= DH) return false;
  return DG[y * DW + x] === 0;
};
Kit.onResize = build; build();

Kit.tray([
  { icon: '🍪', id: 'crumb' }, { icon: '⛏️', id: 'dig' }, { icon: '🌼', id: 'flower' }, { icon: '🧹', id: 'reset' }
], id => {
  if (id === 'reset'){ build(); Sound.ding(); return; }
  tool = id;
}, 'crumb');

Kit.canvas.addEventListener('pointerdown', e => {
  if (e.clientY > Kit.H - 100) return;
  if (tool === 'crumb' && e.clientY < dirtTop){
    crumbs.push({ x: e.clientX, y: e.clientY, amount: 6 });
    Sound.click();
  } else if (tool === 'flower' && e.clientY < dirtTop){
    flowers.push({ x: e.clientX, y: Math.min(e.clientY, dirtTop - 10), e: pick(['🌼', '🌷', '🍄', '🌿']), grow: 0 });
    Sound.ding();
  }
});
Kit.canvas.addEventListener('pointermove', e => {
  if (tool === 'dig' && Kit.pointers.has(e.pointerId) && e.clientY >= dirtTop){
    digAt(e.clientX, e.clientY, 22);
    if (Math.random() < 0.15) Sound.crumble();
  }
});

/* ---------- errands ----------
   An ant heading into the nest follows a short list of waypoints rather than
   nosing at the walls, so it always actually arrives at the room it wanted. */
function sendTo(ant, id){
  ant.job = id;
  ant.route = rooms[id].path.slice();
  ant.sit = 0;
}
/* The way out is worked out from where the ant IS, not from what it was doing.
   Reading it off the job was wrong for anything whose job was not a room name,
   and sent ants in the deep rooms out along the pantry's corridor - which does
   not connect to them, so they pressed into solid dirt until their route
   happened to change. Only the central shaft joins the two levels. */
function exitRoute(ant){
  const top = { x: entrance.x, y: dirtTop - 26 };
  if (ant.y <= dirtTop) return [top];
  if (Math.abs(ant.x - entrance.x) < Kit.W * 0.07)      // already in the shaft
    return [{ x: entrance.x, y: ant.y }, top];
  let best = null, bd = 1e9;
  for (const id in rooms){
    const r = rooms[id], d = Math.hypot(r.x - ant.x, r.y - ant.y);
    if (d < bd){ bd = d; best = r; }
  }
  if (!best) return [top];
  return [{ x: best.x, y: best.y }, { x: entrance.x, y: best.y }, top];
}
function leaveNest(ant){                            // out through its own corridor
  ant.job = 'leaving';
  ant.route = exitRoute(ant);
}

Kit.loop((dt, t) => {
  eggWob += dt;

  /* the nursery */
  for (let i = eggs.length - 1; i >= 0; i--){
    const e = eggs[i];
    e.t += dt;
    if (e.t >= EGG_TIME){
      eggs.splice(i, 1);
      if (ants.length + PER_EGG <= MAX_ANTS) hatch(e);
      layIn = 1.2;
    }
  }
  layIn -= dt;                                  // keep a few on the go, staggered
  if (layIn <= 0){
    layIn = LAY_GAP;
    if (eggs.length < 3 && ants.length < MAX_ANTS) layEgg();
  }
  for (const ant of ants){
    let target = null, arrive = 12;
    ant.age += dt;
    if (!ant.goodbye && ant.age > ant.life - GOODBYE) sayGoodbye(ant);
    if (ant.goodbye && ant.y > dirtTop && ant.age > ant.life + 20){
      ant.age = ant.life;                        // try the way out again from here
      leaveNest(ant);
    }

    if (ant.goodbye && ant.y < dirtTop && (!ant.route || !ant.route.length)){
      target = ant.exit; arrive = 8;              // out through the grass and away
    } else if (ant.sit > 0){                              // busy in a room
      ant.sit -= dt;
      if (ant.sit <= 0){
        if (ant.job === 'potty'){
          puffs.push({ x: ant.x, y: ant.y - 10, e: '💧', age: 0 });
          Sound.squeak();
        }
        leaveNest(ant);
      }
    } else if (ant.route && ant.route.length){
      target = ant.route[0];
      arrive = 14;
      if (Math.hypot(target.x - ant.x, target.y - ant.y) < arrive){
        ant.route.shift();
        if (!ant.route.length){
          if (ant.job === 'leaving'){ ant.job = 'forage'; ant.route = null; }
          else {
            ant.sitAt = rooms[ant.job];
            ant.sit = ant.job === 'potty' ? rand(1.4, 2.4)
                    : ant.job === 'bed'   ? rand(2.5, 5)
                    : rand(.5, 1.1);
            if (ant.job === 'pantry' && ant.carrying){
              ant.carrying = false; stored = Math.min(24, stored + 1); Sound.click();
            }
          }
        }
        target = ant.route && ant.route.length ? ant.route[0] : null;
      }
    } else if (ant.carrying){
      sendTo(ant, 'pantry');
    } else {
      let bd = 1e9;                                // nearest crumb, above ground
      for (const c of crumbs){
        const d = (c.x - ant.x) ** 2 + (c.y - ant.y) ** 2;
        if (d < bd){ bd = d; target = c; }
      }
    }

    if (target){
      const want = Math.atan2(target.y - ant.y, target.x - ant.x);
      let diff = want - ant.a;
      while (diff > Math.PI) diff -= 6.283; while (diff < -Math.PI) diff += 6.283;
      ant.a += diff * dt * (ant.route ? 5 : 2) + rand(-0.4, 0.4) * dt;
    } else if (ant.sit <= 0){
      ant.a += rand(-1.6, 1.6) * dt;
    }

    if (ant.sit > 0){
      const r = ant.sitAt;                         // shuffle about inside the room
      ant.x += (r.x + Math.sin(t * 1.4 + ant.wob) * r.r * .45 - ant.x) * dt * 2.2;
      ant.y += (r.y + Math.cos(t * 1.1 + ant.wob) * r.r * .30 - ant.y) * dt * 2.2;
      ant.a += dt * .6;
    } else {
      const sp = ant.goodbye ? ant.speed * .82 : (ant.route ? ant.speed * 1.25 : ant.speed);
      const nx = ant.x + Math.cos(ant.a) * sp * dt;
      const ny = ant.y + Math.sin(ant.a) * sp * dt;
      const leaving = ant.goodbye && ny < dirtTop;      // let this one past the edge
      if ((leaving || (nx > 8 && nx < Kit.W - 8)) && ny > 60 && ny < Kit.H - 40 && isDug(nx, ny)){
        ant.x = nx; ant.y = ny;
      } else {
        ant.a += Math.PI * rand(0.4, 0.7);
      }
    }

    if (!ant.carrying && !ant.route && ant.sit <= 0){
      for (const c of crumbs){
        if (Math.hypot(c.x - ant.x, c.y - ant.y) < 14){
          ant.carrying = true; c.amount--; Sound.click();
          sendTo(ant, 'pantry');
          break;
        }
      }
    }
    // after dropping off, some ants have somewhere else to be
    if (ant.job === 'leaving' && !ant.goodbye && ant.route && ant.route.length === 3 && !ant.detoured){
      ant.detoured = 1;
      const r = Math.random();
      if (r < .28) sendTo(ant, 'potty');
      else if (r < .45) sendTo(ant, 'bed');
      else if (r < .55) sendTo(ant, 'nursery');
    }
    if (ant.job === 'forage') ant.detoured = 0;
  }

  ants = ants.filter(a => a.x > -40 && a.x < Kit.W + 40);

  for (let i = crumbs.length - 1; i >= 0; i--)
    if (crumbs[i].amount <= 0) crumbs.splice(i, 1);
  for (const f of flowers) f.grow = Math.min(1, f.grow + dt * 0.8);
  for (const p of puffs) p.age += dt;
  puffs = puffs.filter(p => p.age < 1.4);

  /* ---------- draw ---------- */
  const g = ctx.createLinearGradient(0, 0, 0, dirtTop);
  g.addColorStop(0, '#8ED0F5'); g.addColorStop(1, '#C8E89B');
  ctx.fillStyle = g; ctx.fillRect(0, 0, Kit.W, dirtTop);
  drawEmoji(ctx, '🌞', Kit.W * 0.86, 90, 70, t * 0.05);
  ctx.fillStyle = '#7FBF4D'; ctx.fillRect(0, dirtTop - 12, Kit.W, 12);

  for (let y = 0; y < DH; y++){
    for (let x = 0; x < DW; x++){
      if (DG[y * DW + x]){
        ctx.fillStyle = (x + y) % 2 ? '#8B5A3C' : '#84543a';
      } else {
        ctx.fillStyle = '#4a2e1d';
      }
      ctx.fillRect(x * dirtCell, dirtTop + y * dirtCell, dirtCell, dirtCell);
    }
  }

  // the rooms, so the nest reads as a house and not a hole
  for (const R of ROOMS){
    const r = rooms[R.id];
    ctx.fillStyle = '#6B4A32';
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 1.06, r.r * 0.92, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,225,180,.20)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 1.06, r.r * 0.92, 0, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(r.x, r.y + r.r * .78, r.r * .82, r.r * .16, 0, 0, 6.283); ctx.fill();

    if (R.id === 'pantry'){
      const n = Math.min(9, Math.ceil(stored / 2.6));
      for (let i = 0; i < n; i++){
        const col = i % 3, row = (i / 3) | 0;
        drawEmoji(ctx, '🍪', r.x - r.r * .42 + col * r.r * .42, r.y + r.r * .52 - row * r.r * .36, r.r * .40);
      }
      if (!n) drawEmoji(ctx, '🍪', r.x, r.y, r.r * .58, 0, .28);
    } else if (R.id === 'nursery'){
      for (const e of eggs){
        const k = e.t / EGG_TIME;                   // the wobble builds as it ripens
        const shake = Math.sin(eggWob * (3 + k * 16) + e.wob) * (1.2 + k * 3.4);
        drawEmoji(ctx, '🥚', e.x + shake, e.y, r.r * (.38 + k * .10), shake * .04);
      }
      if (!eggs.length) drawEmoji(ctx, '🥚', r.x, r.y, r.r * .38, 0, .22);
    } else if (R.id === 'potty'){
      drawEmoji(ctx, '🚽', r.x, r.y + r.r * .22, r.r * .82);
    } else {
      drawEmoji(ctx, '🛏️', r.x, r.y + r.r * .34, r.r * .74);
      drawEmoji(ctx, '💤', r.x + r.r * .44, r.y - r.r * .34,
        r.r * .40, 0, .55 + Math.sin(eggWob * 1.6) * .35);
    }
  }

  // the mound on the surface, with a hole you can see the shaft through
  drawEmoji(ctx, '⛰️', entrance.x, dirtTop - 16, 44);
  ctx.fillStyle = '#3a2415';
  ctx.beginPath(); ctx.ellipse(entrance.x, dirtTop - 4, 11, 5, 0, 0, 6.283); ctx.fill();

  for (const f of flowers) drawEmoji(ctx, f.e, f.x, f.y, 16 + f.grow * 30);
  for (const c of crumbs) drawEmoji(ctx, '🍪', c.x, c.y, 14 + c.amount * 3);
  for (const p of puffs)
    drawEmoji(ctx, p.e, p.x, p.y - p.age * 22, 15, 0, Math.max(0, 1 - p.age / 1.4));

  drawEmoji(ctx, '🐜', 26, 30, 22);
  ctx.fillStyle = '#22331e';
  ctx.font = '800 22px "Baloo 2", system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(ants.length, 44, 31);

  for (const ant of ants){
    const wig = Math.sin(t * 14 + ant.wob) * 0.15;
    ctx.save(); ctx.translate(ant.x, ant.y); ctx.rotate(ant.a + wig);
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath(); ctx.arc(-5, 0, 4.5, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(5, 0, 3, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 1.4;
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(3, s * 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-6, s * 6); ctx.stroke();
    }
    if (ant.carrying) drawEmoji(ctx, '🍪', 9, 0, 11);
    ctx.restore();
    if (ant.job === 'bed' && ant.sit > 0)
      drawEmoji(ctx, '💤', ant.x + 10, ant.y - 10, 12, 0, .7);
  }
});
</script>
</body>
</html>
