<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RaisedCurious Play</title>
<meta name="description" content="Hands-on physics toys and curiosity games for little kids. Free, no ads, nothing to install.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#101426; --text:#F4F6FF; --dim:#9AA3C7; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{min-height:100%; background:
    radial-gradient(1000px 700px at 20% -10%, #1b2f5c 0%, transparent 60%),
    radial-gradient(900px 700px at 110% 30%, #3b1b4f 0%, transparent 55%),
    #0a0e20;}
  body{font-family:'Baloo 2',cursive; color:var(--text); -webkit-user-select:none; user-select:none;}
  header{text-align:center; padding:34px 16px 8px;}
  h1{font-weight:800; font-size:clamp(34px,6vw,56px); line-height:1;
    background:linear-gradient(90deg,#FFD24A,#FF6FA5,#38BDF8,#4ADE80);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sub{font-family:'Nunito',sans-serif; font-weight:700; color:var(--dim); margin-top:8px; font-size:15px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:16px;
    padding:22px; max-width:1000px; margin:0 auto;}
  a.tile{display:grid; place-items:center; gap:6px; aspect-ratio:1/1; border-radius:26px;
    text-decoration:none; color:#101426; font-weight:800; font-size:clamp(15px,2vw,19px);
    text-align:center; padding:12px; border:4px solid rgba(255,255,255,.25);
    box-shadow:0 12px 26px rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.12);
    transition:transform .12s ease;}
  a.tile:active{transform:scale(.95);}
  .tile .ico{font-size:clamp(44px,7vw,64px); line-height:1;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));}
  footer{text-align:center; font-family:'Nunito',sans-serif; font-weight:700;
    color:var(--dim); font-size:13px; padding:10px 16px 34px;}
  footer a{color:var(--dim);}
  @media (prefers-reduced-motion: reduce){ a.tile{transition:none} }
</style>
</head>
<body>
<header>
  <h1>RaisedCurious Play</h1>
  <p class="sub">Poke it. Pour it. Knock it over. See what happens.</p>
</header>

<nav class="grid">
  <a class="tile" href="topple/"   style="background:linear-gradient(160deg,#FFC93C,#FF9330)"><span class="ico">🧱</span>Tower Topple</a>
  <a class="tile" href="marbles/"  style="background:linear-gradient(160deg,#7CE0FF,#38BDF8)"><span class="ico">🔵</span>Marble Run</a>
  <a class="tile" href="sand/"     style="background:linear-gradient(160deg,#FFE28A,#E8C05A)"><span class="ico">⏳</span>Sand &amp; Water</a>
  <a class="tile" href="launch/"   style="background:linear-gradient(160deg,#FF9AA2,#FF6FA5)"><span class="ico">🚀</span>Launch Lab</a>
  <a class="tile" href="tilt/"     style="background:linear-gradient(160deg,#B79CFF,#8B6FE8)"><span class="ico">🌀</span>Tilt Maze</a>
  <a class="tile" href="magnet/"   style="background:linear-gradient(160deg,#FF8A8A,#E85D5D)"><span class="ico">🧲</span>Magnet Lab</a>
  <a class="tile" href="balance/"  style="background:linear-gradient(160deg,#9BE8A8,#4ADE80)"><span class="ico">⚖️</span>Balance Zoo</a>
  <a class="tile" href="paint/"    style="background:linear-gradient(160deg,#FFB6E1,#FF7ACD)"><span class="ico">🎨</span>Paint Physics</a>
  <a class="tile" href="pipes/"    style="background:linear-gradient(160deg,#8FD9FF,#5CB8E8)"><span class="ico">🚰</span>Water Pipes</a>
  <a class="tile" href="bugs/"     style="background:linear-gradient(160deg,#C8E89B,#8FC45A)"><span class="ico">🐜</span>Bug Garden</a>
  <a class="tile" href="https://wiggle-world2.raisedcurious.com" style="background:linear-gradient(160deg,#FFD24A,#FF6FA5)"><span class="ico">🪩</span>Wiggle World</a>
</nav>

<footer>Free from <a href="https://raisedcurious.com">RaisedCurious</a> · no ads, nothing to install, nothing recorded</footer>

<script>
  // Google Analytics placeholder intentionally omitted; add G-2TDGR1R3VF here if wanted.
</script>
</body>
</html>
